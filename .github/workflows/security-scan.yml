name: Security Scan

on:
  push:
    branches:
      - main
      - dev
  schedule:
    # Weekly scan every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV Vulnerability Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    with:
      upload-sarif: false
      fail-on-vuln: false
