name: Dependency Review

# Disabled: requires GitHub Advanced Security (GHAS), which is not available
# on private repos with personal accounts. Re-enable when repo is public.
# on:
#   pull_request:
#     branches: [main, dev]

on:
  workflow_dispatch:  # manual trigger only until GHAS is available

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: './.github/dependency-review-config.yml'
